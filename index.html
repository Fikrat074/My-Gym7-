<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><title>Моя тренировка v6</title><style>body{margin:0;background:#101010;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:680px;margin:auto;padding:16px}.hero,.card,.footer{background:#1d1d1d;border-radius:20px;padding:16px;margin:12px 0}.hero h1{margin:0 0 5px}.muted{color:#aaa}.days{display:flex;gap:7px;overflow:auto;padding:4px 0}.days button,.small,.primary{border:0;border-radius:13px;padding:10px 13px;background:#303030;color:#fff}.days .active,.primary{background:#fff;color:#000}.name{font-size:18px;font-weight:700}.muscle{font-size:13px;color:#aaa;margin-top:3px}.info{display:flex;gap:16px;margin:12px 0;color:#ddd}.weights{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.weights input{width:62px;padding:9px;border:1px solid #555;border-radius:10px;background:#101010;color:#fff}.sets{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.set{width:45px;height:40px;border:0;border-radius:12px;background:#333;color:#fff}.set.done{background:#fff;color:#000}.bar{height:6px;background:#333;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#fff}.timer{font-size:22px;font-weight:700}.next{color:#aaa;font-size:13px;margin-top:5px}</style></head><body><main><div class='hero'><h1>💪 Моя тренировка v6</h1><div class='muted'>Фокус: плечи • грудь • V-спина • руки • ноги • пресс</div><div style='margin-top:14px' class='bar'><div id='fill' class='fill'></div></div><div id='progress' class='muted' style='margin-top:7px'></div></div><div id='days' class='days'></div><div id='workout'></div><div class='footer'><div id='timer' class='timer'>⏱ Отдых: 01:00</div><div class='next'>После подхода нажми номер подхода, затем «Начать отдых».</div><button class='primary' onclick='startRest()' style='margin-top:10px'>Начать отдых 60 сек</button></div></main><script>
const D={
'Пн':[['Жим штанги лёжа','Грудь',4,'8–10',25],['Жим гантелей 30°','Верх груди',4,'10–12',16],['Кроссовер','Грудь',3,'12–15',12.5],['Брусья','Грудь/трицепс',3,'8–12',0],['Жим груди в тренажёре','Грудь',3,'12–15',35],['Разгибание на блоке','Трицепс',4,'12–15',20],['Французский жим EZ','Трицепс',3,'10–12',20]],
'Вт':[['Тяга верхнего блока','V-спина',4,'8–12',45],['Тяга штанги','Спина',4,'8–10',35],['Горизонтальная тяга','Спина',3,'10–12',40],['Тяга гантели','Широчайшие',3,'10–12',22.5],['Пуловер','Широчайшие',3,'12–15',16],['Сгибание со штангой','Бицепс',4,'8–10',25],['Молотки','Бицепс',3,'10–12',12.5],['Скамья Скотта','Бицепс',3,'12–15',20]],
'Ср':[['Присед','Ноги/ягодицы',4,'6–10',40],['Жим ногами','Ноги',4,'10–12',90],['Разгибание ног','Квадрицепс',3,'12–15',35],['Сгибание лёжа','Бицепс бедра',4,'10–12',30],['Выпады','Ноги/ягодицы',3,'12/нога',12.5],['Икры стоя','Икры',4,'15–20',40],['Скручивания','Пресс',4,'15–20',25],['Подъём ног в висе','Нижний пресс',4,'12–15',0],['Планка','Кор',3,'45–60 сек',0]],
'Чт':[['Жим гантелей сидя','Плечи',4,'8–10',16],['Разведения в стороны','Средняя дельта',4,'12–15',7.5],['Тяга к подбородку','Плечи',3,'10–12',20],['Передние подъёмы','Передняя дельта',3,'12–15',7.5],['Задняя дельта','Задняя дельта',3,'12–15',7.5],['Жим плечами','Плечи',3,'12–15',30],['Русский твист','Кор',4,'20',5],['Велосипед','Пресс',3,'20–30',0]],
'Пт':[['EZ curl','Бицепс',4,'8–10',25],['Кабельный curl','Бицепс',3,'12–15',15],['Концентрированный curl','Бицепс',3,'12–15',10],['Наклонный curl 45°','Бицепс',3,'10–12',10],['Разгибание над головой','Трицепс',4,'10–12',20],['Узкие брусья','Трицепс',3,'10–15',0],['Канат','Трицепс',4,'12–15',20],['Отжимания от скамьи','Трицепс',3,'15–20',0]],
'Сб':[['Фронтальный присед','Ноги',4,'8–10',30],['Румынская тяга','Бицепс бедра/ягодицы',4,'10–12',40],['Hack Squat','Квадрицепс',3,'12–15',50],['Ягодичный мост','Ягодицы',4,'12–15',50],['Сгибание сидя','Бицепс бедра',3,'12–15',30],['Икры в жиме','Икры',4,'20–25',70],['Скручивания с весом','Пресс',4,'15–20',15],['L-Sit','Кор',3,'10–15 сек',0],['Боковая планка','Кор',3,'30–45 сек',0]]};
const order=['Пн','Вт','Ср','Чт','Пт','Сб']; let day=order[(new Date().getDay()+6)%7]; if(!D[day])day='Пн'; let S=JSON.parse(localStorage.getItem('v6')||'{}'), interval;
function save(){localStorage.setItem('v6',JSON.stringify(S))} function k(i){return day+'_'+i}
function render(){days.innerHTML=order.map(x=>`<button class='${x==day?'active':''}' onclick="day='${x}';render()">${x}</button>`).join('');let a=D[day],done=0,total=0;workout.innerHTML=a.map((e,i)=>{let s=S[k(i)]||{today:e[4],next:e[4],done:[]};done+=s.done.length;total+=e[2];return `<div class='card'><div class='name'>${i+1}. ${e[0]}</div><div class='muscle'>${e[1]}</div><div class='info'>🎯 ${e[2]} × ${e[3]} &nbsp; ⏱ 60–120 сек</div><div class='weights'>Сегодня <input type='number' step='2.5' value='${s.today}' onchange="weight(${i},'today',this.value)"> кг → Следующая <input type='number' step='2.5' value='${s.next}' onchange="weight(${i},'next',this.value)"> кг <button class='small' onclick='plus(${i},2.5)'>+2.5</button><button class='small' onclick='plus(${i},5)'>+5</button></div><div class='sets'>${Array.from({length:e[2]},(_,j)=>`<button class='set ${s.done.includes(j)?'done':''}' onclick='toggle(${i},${j})'>${j+1}</button>`).join('')}</div></div>`}).join('');progress.textContent=`${day}: выполнено ${done}/${total} подходов`;fill.style.width=(done/total*100)+'%'}
function init(i){let e=D[day][i];S[k(i)] ||= {today:e[4],next:e[4],done:[]}} function weight(i,t,v){init(i);S[k(i)][t]=+v;save();render()} function plus(i,n){init(i);S[k(i)].next=+(S[k(i)].today||0)+n;save();render()} function toggle(i,j){init(i);let a=S[k(i)].done;a.includes(j)?S[k(i)].done=a.filter(x=>x!=j):a.push(j);save();render()} function startRest(){let s=60;clearInterval(interval);timer.textContent='⏱ Отдых: 01:00';interval=setInterval(()=>{s--;timer.textContent='⏱ Отдых: '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s<=0){clearInterval(interval);timer.textContent='🔥 Отдых закончен — следующий подход!'}},1000)} render();</script></body></html>
